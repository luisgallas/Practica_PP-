name: Django Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10']
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: practica_pp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        cp .env.example .env
        sed -i 's/DB_NAME=practica_pp/DB_NAME=practica_pp_test/' .env
        sed -i 's/DB_USER=postgres/DB_USER=postgres/' .env
        sed -i 's/DB_PASSWORD=your_password/DB_PASSWORD=postgres/' .env
    
    - name: Run Django check
      run: |
        python manage.py check
    
    - name: Run migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/practica_pp_test
      run: |
        python manage.py migrate
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/practica_pp_test
      run: |
        python manage.py test
