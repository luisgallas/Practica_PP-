name: Verificar Hospeda PY
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hospeda
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pruebas_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: hospeda
      DB_USER: postgres
      DB_PASSWORD: pruebas_ci
      DB_HOST: localhost
      SECRET_KEY: clave-exclusiva-de-pruebas-ci-sin-acceso-a-datos-reales-2026
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test presupuesto --noinput
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
