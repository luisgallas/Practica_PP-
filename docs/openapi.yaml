components:
  schemas:
    AccesoRenovado:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    Alojamiento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 200
        descripcion:
          type: string
          maxLength: 10000
        calle:
          type: string
          maxLength: 255
        ubicacion:
          type: string
          description: Ciudad donde se encuentra la propiedad.
          maxLength: 255
        tipo_alojamiento:
          $ref: '#/components/schemas/TipoAlojamientoEnum'
        capacidad_maxima_huespedes:
          type: integer
          maximum: 100
          minimum: 1
        precio_noche:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: Precio noche (Gs.)
        precio_fin_semana:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: Precio fin de semana (Gs.)
        tarifa_limpieza:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: Tarifa limpieza (Gs.)
        estado:
          $ref: '#/components/schemas/AlojamientoEstadoEnum'
        permite_mascotas:
          type: boolean
        permite_fumar:
          type: boolean
        permite_fiestas:
          type: boolean
        politica_cancelacion:
          $ref: '#/components/schemas/PoliticaCancelacionEnum'
        anfitrion:
          allOf:
          - $ref: '#/components/schemas/UsuarioPublico'
          readOnly: true
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
          readOnly: true
        servicios:
          type: array
